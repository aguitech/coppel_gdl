<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tablero touch</title><link rel="stylesheet" href="/style.css"></head><body class=""><main><header><span class="brand">AFORE COPPEL</span><span id="status" class="status">Sin conexión</span></header><h1>Tu futuro está<br>en tus manos</h1><form id="loadForm"><label>Código de prerregistro<input id="code" placeholder="Código o URL del QR" required autocomplete="off"></label><button id="load">Cargar participante</button><button class="muted" type="button" id="fullscreen">Pantalla completa</button></form><div class="participant" id="name">Esperando participante</div><p id="goal"></p><div class="grid"><button class="effect" data-effect="save">✦ Ahorrar<small>Haz crecer tu energía</small></button><button class="effect" data-effect="plan">✧ Planear<small>Traza una constelación</small></button><button class="effect" data-effect="learn">◎ Conocer<small>Expande tus posibilidades</small></button><button class="effect" data-effect="goal">★ Mi meta<small>Enciende tu futuro</small></button></div><div id="pad" class="pad">Toca aquí para lanzar energía en una posición de la otra pantalla</div><form><button type="button" id="final">Revelar mi futuro</button><button type="button" class="muted" id="reset">Nuevo participante</button></form><p id="message" class="message" role="status"></p></main><section id="auth" class="overlay"><div class="login"><span class="brand">AFORE COPPEL</span><h1>Conectar estación</h1><form id="authForm"><label>Estación<input id="station" value="gdl-01" required pattern="[-a-zA-Z0-9_]{1,32}"></label><label>Clave de estación<input id="token" type="password" required minlength="16" autocomplete="off"></label><button>Conectar</button></form><p id="authError"></p></div></section><script type=module src=/touch.js></script></body></html>
